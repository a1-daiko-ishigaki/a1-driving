# ルートへのアクセスをスタッフ画面にリダイレクト（index.html経由でも同様に処理される）
[[redirects]]
  from = "/"
  to = "/staff_gps_app.html"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
